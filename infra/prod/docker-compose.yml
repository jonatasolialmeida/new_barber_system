version: '3.9'

services:
  postgres:
    image: postgres:16-alpine
    container_name: barber_postgres_prod
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5434:5432"
    volumes:
      - postgres_data_prod:/var/lib/postgresql/data
      - ./backups:/backups
    networks:
      - barber_network_prod
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: barber_pgadmin_prod
    restart: always
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD}
      PGADMIN_CONFIG_SERVER_MODE: 'True'
    ports:
      - "5052:80"
    volumes:
      - pgadmin_data_prod:/var/lib/pgadmin
    networks:
      - barber_network_prod
    depends_on:
      - postgres

  redis:
    image: redis:7-alpine
    container_name: barber_redis_prod
    restart: always
    command: redis-server --requirepass ${REDIS_PASSWORD}
    ports:
      - "6381:6379"
    volumes:
      - redis_data_prod:/data
    networks:
      - barber_network_prod
    healthcheck:
      test: ["CMD", "redis-cli", "--raw", "incr", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  backend:
    build:
      context: ../../backend
      dockerfile: Dockerfile
    container_name: barber_backend_prod
    restart: always
    command: gunicorn barber_project.wsgi:application --bind 0.0.0.0:8000 --workers 4 --threads 2
    environment:
      DEBUG: "False"
      SECRET_KEY: ${SECRET_KEY}
      ALLOWED_HOSTS: ${ALLOWED_HOSTS}
      DB_ENGINE: django.db.backends.postgresql
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_HOST: postgres
      DB_PORT: 5432
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS}
      CELERY_BROKER_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      CELERY_RESULT_BACKEND: redis://:${REDIS_PASSWORD}@redis:6379/0
      REDIS_CACHE_URL: redis://:${REDIS_PASSWORD}@redis:6379/1
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    ports:
      - "8002:8000"
    volumes:
      - static_files_prod:/app/staticfiles
      - media_files_prod:/app/mediafiles
    networks:
      - barber_network_prod
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health/alive/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  celery_worker:
    build:
      context: ../../backend
      dockerfile: Dockerfile
    container_name: barber_celery_worker_prod
    restart: always
    command: celery -A barber_project worker --loglevel=info
    environment:
      DEBUG: "False"
      SECRET_KEY: ${SECRET_KEY}
      DB_ENGINE: django.db.backends.postgresql
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_HOST: postgres
      DB_PORT: 5432
      CELERY_BROKER_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      CELERY_RESULT_BACKEND: redis://:${REDIS_PASSWORD}@redis:6379/0
    networks:
      - barber_network_prod
    depends_on:
      - postgres
      - redis

  celery_beat:
    build:
      context: ../../backend
      dockerfile: Dockerfile
    container_name: barber_celery_beat_prod
    restart: always
    command: celery -A barber_project beat --loglevel=info
    environment:
      DEBUG: "False"
      SECRET_KEY: ${SECRET_KEY}
      DB_ENGINE: django.db.backends.postgresql
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_HOST: postgres
      DB_PORT: 5432
      CELERY_BROKER_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      CELERY_RESULT_BACKEND: redis://:${REDIS_PASSWORD}@redis:6379/0
    networks:
      - barber_network_prod
    depends_on:
      - postgres
      - redis

  frontend:
    build:
      context: ../../frontend
      dockerfile: Dockerfile
    container_name: barber_frontend_prod
    restart: always
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
    ports:
      - "3002:3000"
    networks:
      - barber_network_prod
    depends_on:
      - backend

  portainer:
    image: portainer/portainer-ce:latest
    container_name: barber_portainer_prod
    restart: always
    ports:
      - "9002:9000"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - portainer_data_prod:/data
    networks:
      - barber_network_prod

  # Nginx reverse proxy (opcional - para produção)
  nginx:
    image: nginx:alpine
    container_name: barber_nginx_prod
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
      - static_files_prod:/usr/share/nginx/html/static:ro
      - media_files_prod:/usr/share/nginx/html/media:ro
    networks:
      - barber_network_prod
    depends_on:
      - backend
      - frontend

volumes:
  postgres_data_prod:
  pgadmin_data_prod:
  redis_data_prod:
  static_files_prod:
  media_files_prod:
  portainer_data_prod:

networks:
  barber_network_prod:
    driver: bridge
