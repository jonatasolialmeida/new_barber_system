services:
  postgres:
    image: postgres:16-alpine
    container_name: barber_postgres_dev
    restart: unless-stopped
    environment:
      POSTGRES_DB: barber_db
      POSTGRES_USER: barber_user
      POSTGRES_PASSWORD: barber_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data_dev:/var/lib/postgresql/data
    networks:
      - barber_network_dev

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: barber_pgadmin_dev
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@barber.com
      PGADMIN_DEFAULT_PASSWORD: admin123
      PGADMIN_CONFIG_SERVER_MODE: 'False'
    ports:
      - "5050:80"
    volumes:
      - pgadmin_data_dev:/var/lib/pgadmin
    networks:
      - barber_network_dev
    depends_on:
      - postgres

  redis:
    image: redis:7-alpine
    container_name: barber_redis_dev
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data_dev:/data
    networks:
      - barber_network_dev

  backend:
    build:
      context: ../../backend
      dockerfile: Dockerfile
    container_name: barber_backend_dev
    restart: unless-stopped
    command: python manage.py runserver 0.0.0.0:8000
    environment:
      DEBUG: "True"
      SECRET_KEY: dev-secret-key-change-in-production
      ALLOWED_HOSTS: localhost,127.0.0.1,backend
      DB_ENGINE: django.db.backends.postgresql
      DB_NAME: barber_db
      DB_USER: barber_user
      DB_PASSWORD: barber_password
      DB_HOST: postgres
      DB_PORT: 5432
      CORS_ALLOWED_ORIGINS: http://localhost:3000,http://127.0.0.1:3000
      REDIS_CACHE_URL: redis://redis:6379/1
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0
    ports:
      - "8000:8000"
    volumes:
      - ../../backend:/app
    networks:
      - barber_network_dev
    depends_on:
      - postgres
      - redis

  frontend:
    build:
      context: ../../frontend
      dockerfile: Dockerfile.dev
    container_name: barber_frontend_dev
    restart: unless-stopped
    command: npm run dev
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000/api
    ports:
      - "3000:3000"
    volumes:
      - ../../frontend:/app
      - /app/node_modules
      - /app/.next
    networks:
      - barber_network_dev
    depends_on:
      - backend

  portainer:
    image: portainer/portainer-ce:latest
    container_name: barber_portainer_dev
    restart: unless-stopped
    ports:
      - "9000:9000"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - portainer_data_dev:/data
    networks:
      - barber_network_dev

volumes:
  postgres_data_dev:
  pgadmin_data_dev:
  redis_data_dev:
  portainer_data_dev:

networks:
  barber_network_dev:
    driver: bridge
